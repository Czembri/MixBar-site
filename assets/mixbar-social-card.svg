<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">MixBar — every app, every tab, your volume</title>
  <desc id="description">Independent volume control and EQ for Mac apps and supported browser tabs.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="36" x2="1128" y2="594" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161d28"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#74f5a7"/>
      <stop offset="1" stop-color="#20bdf2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#background)"/>
  <circle cx="1095" cy="95" r="240" fill="#20bdf2" opacity=".07"/>
  <circle cx="105" cy="585" r="260" fill="#74f5a7" opacity=".06"/>
  <g transform="translate(86 91)" filter="url(#shadow)">
    <rect width="180" height="180" rx="43" fill="#10131a"/>
    <path d="M41 48h98M41 90h98M41 132h98" fill="none" stroke="#eaf0f6" stroke-width="13" stroke-linecap="round" opacity=".94"/>
    <circle cx="72" cy="48" r="18" fill="url(#accent)"/>
    <circle cx="115" cy="90" r="18" fill="url(#accent)"/>
    <circle cx="82" cy="132" r="18" fill="url(#accent)"/>
  </g>
  <text x="310" y="160" fill="#f7f9fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="78" font-weight="750">MixBar</text>
  <text x="86" y="362" fill="#f7f9fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="64" font-weight="720">Every app. Every tab.</text>
  <text x="86" y="440" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="64" font-weight="720">Your volume.</text>
  <text x="88" y="520" fill="#aeb8c6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28">Native volume control and EQ for macOS 14.2+</text>
  <rect x="86" y="560" width="1028" height="2" fill="#ffffff" opacity=".12"/>
  <text x="88" y="600" fill="#d6dde8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">getmixbar.com</text>
  <text x="1112" y="600" text-anchor="end" fill="#d6dde8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">$21 once</text>
</svg>
